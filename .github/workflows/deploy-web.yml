name: Deploy App Service web
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'requirements*.txt'
      - 'scripts/build-packages.py'
      - '.github/workflows/deploy-web.yml'
permissions:
  contents: read
concurrency:
  group: app-service-web-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python scripts/check-release.py
      - run: python -m pytest -q
      - run: python scripts/build-packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: web-source
          path: dist/web.zip
          if-no-files-found: error
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-source
          path: web-artifact
      - name: Extract web package
        run: unzip web-artifact/web.zip -d web-package
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_42EEF93B77A04D2180A5480DCBE2FD54 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A6170617F7E346409B4A7FD7C0F413E3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DFF6C5DAFB9B414BB1DB5811E886DD53 }}
      - name: Deploy web package to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: usblogic
          package: web-package
