name: Deploy Function API

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'usb_functions/**'
      - 'config/**'
      - 'requirements*.txt'
      - 'function_app.py'
      - 'host.json'
      - 'scripts/**'
      - '.github/workflows/main_intuneusbfunction.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: function-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python scripts/check-release.py
      - run: python -m pytest -q
      - run: python scripts/build-packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: function-source
          path: dist/function.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: function-source
          path: function-artifact
      - name: Extract Function package
        run: unzip function-artifact/function.zip -d function-package
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_42EEF93B77A04D2180A5480DCBE2FD54 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A6170617F7E346409B4A7FD7C0F413E3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DFF6C5DAFB9B414BB1DB5811E886DD53 }}
      - name: Deploy Function package to Flex Consumption
        uses: Azure/functions-action@v1
        with:
          app-name: intuneusbfunction
          package: function-package
          sku: flexconsumption
          remote-build: true
